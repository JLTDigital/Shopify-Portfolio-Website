name: Publish posts

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**"
      - "images/posts/**"
      - "scripts/build_readme.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install -r requirements.txt
      - name: Build pages
        run: python scripts/build_readme.py
      - name: Commit published pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Publish blog pages
          file_pattern: posts/** index.html readme.html rss.xml sitemap.xml robots.txt
